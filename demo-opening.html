<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开场动画演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(180deg, #4fc3f7 0%, #81d4fa 40%, #b3e5fc 70%, #e1f5fe 100%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* ===== 太阳 ===== */
  .sun {
    position: absolute;
    top: 8%;
    right: 12%;
    width: 100px;
    height: 100px;
    animation: sun-glow 3s ease-in-out infinite;
  }
  @keyframes sun-glow {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(255,235,59,0.6)); }
    50% { transform: scale(1.08); filter: drop-shadow(0 0 35px rgba(255,235,59,0.9)); }
  }

  /* 太阳光线 */
  .sun-rays {
    position: absolute;
    top: 8%;
    right: 12%;
    width: 100px;
    height: 100px;
    transform-origin: center;
    animation: rays-rotate 8s linear infinite;
  }
  @keyframes rays-rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* ===== 云朵 ===== */
  .cloud {
    position: absolute;
    animation: drift linear infinite;
  }
  .cloud-1 { top: 15%; left: -200px; animation-duration: 18s; animation-delay: 0s; }
  .cloud-2 { top: 28%; left: -200px; animation-duration: 25s; animation-delay: 3s; transform: scale(0.7); }
  .cloud-3 { top: 42%; left: -200px; animation-duration: 30s; animation-delay: 8s; transform: scale(1.3); }

  @keyframes drift {
    from { left: -200px; }
    to { left: 110%; }
  }

  /* ===== 小鸟 ===== */
  .bird {
    position: absolute;
    top: 22%;
    font-size: 32px;
    animation: bird-fly 12s linear infinite;
  }
  @keyframes bird-fly {
    0% { left: -50px; top: 20%; }
    25% { top: 15%; }
    50% { top: 25%; }
    75% { top: 18%; }
    100% { left: 110%; top: 22%; }
  }

  /* ===== 草地 ===== */
  .grass {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 120px;
    background: linear-gradient(180deg, #66bb6a 0%, #43a047 50%, #2e7d32 100%);
    border-radius: 50% 50% 0 0 / 30px 30px 0 0;
  }

  /* 小花 */
  .flower {
    position: absolute;
    bottom: 20px;
    font-size: 28px;
    animation: sway 2s ease-in-out infinite;
  }
  .flower-1 { left: 10%; animation-delay: 0s; }
  .flower-2 { left: 25%; animation-delay: 0.3s; font-size: 22px; }
  .flower-3 { left: 45%; animation-delay: 0.6s; }
  .flower-4 { left: 65%; animation-delay: 0.2s; font-size: 24px; }
  .flower-5 { left: 82%; animation-delay: 0.5s; }
  @keyframes sway {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }

  /* ===== 标题文字 ===== */
  .title-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 10;
  }
  .title-main {
    font-size: clamp(48px, 10vw, 96px);
    font-weight: 900;
    color: #fff;
    text-shadow:
      4px 4px 0 #ff6f00,
      8px 8px 0 rgba(0,0,0,0.15);
    letter-spacing: 4px;
    opacity: 0;
    animation: title-pop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
  }
  @keyframes title-pop {
    0% { opacity: 0; transform: scale(0.3) translateY(40px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  .title-sub {
    font-size: clamp(20px, 4vw, 36px);
    font-weight: 700;
    color: #fff;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
    margin-top: 16px;
    opacity: 0;
    animation: sub-fade 0.6s ease-out 1.1s forwards;
  }
  @keyframes sub-fade {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== 波浪底部装饰 ===== */
  .wave {
    position: absolute;
    bottom: 110px;
    width: 100%;
    height: 20px;
    opacity: 0.3;
  }

  /* 进度条 */
  .progress-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 6px;
    width: 0%;
    background: linear-gradient(90deg, #ff6f00, #ffca28);
    animation: progress 3s linear forwards;
    z-index: 20;
  }
  @keyframes progress {
    from { width: 0%; }
    to { width: 100%; }
  }
</style>
</head>
<body>

  <!-- 太阳光线（旋转） -->
  <svg class="sun-rays" viewBox="0 0 100 100">
    <g stroke="#fff59d" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <line x1="50" y1="5" x2="50" y2="15"/>
      <line x1="50" y1="85" x2="50" y2="95"/>
      <line x1="5" y1="50" x2="15" y2="50"/>
      <line x1="85" y1="50" x2="95" y2="50"/>
      <line x1="18" y1="18" x2="25" y2="25"/>
      <line x1="75" y1="75" x2="82" y2="82"/>
      <line x1="82" y1="18" x2="75" y2="25"/>
      <line x1="25" y1="75" x2="18" y2="82"/>
    </g>
  </svg>

  <!-- 太阳 -->
  <svg class="sun" viewBox="0 0 100 100">
    <defs>
      <radialGradient id="sunGrad">
        <stop offset="0%" stop-color="#fff9c4"/>
        <stop offset="60%" stop-color="#ffeb3b"/>
        <stop offset="100%" stop-color="#ffa726"/>
      </radialGradient>
    </defs>
    <circle cx="50" cy="50" r="30" fill="url(#sunGrad)"/>
  </svg>

  <!-- 云朵 1 -->
  <svg class="cloud cloud-1" width="140" height="70" viewBox="0 0 140 70">
    <ellipse cx="35" cy="45" rx="25" ry="20" fill="#fff" opacity="0.95"/>
    <ellipse cx="65" cy="35" rx="30" ry="25" fill="#fff" opacity="0.95"/>
    <ellipse cx="100" cy="45" rx="22" ry="18" fill="#fff" opacity="0.95"/>
    <ellipse cx="50" cy="50" rx="20" ry="15" fill="#f5f5f5" opacity="0.9"/>
  </svg>

  <!-- 云朵 2 -->
  <svg class="cloud cloud-2" width="100" height="50" viewBox="0 0 100 50">
    <ellipse cx="25" cy="32" rx="18" ry="15" fill="#fff" opacity="0.9"/>
    <ellipse cx="50" cy="25" rx="22" ry="18" fill="#fff" opacity="0.9"/>
    <ellipse cx="75" cy="32" rx="16" ry="13" fill="#fff" opacity="0.9"/>
  </svg>

  <!-- 云朵 3 -->
  <svg class="cloud cloud-3" width="180" height="90" viewBox="0 0 180 90">
    <ellipse cx="40" cy="55" rx="30" ry="24" fill="#fff" opacity="0.92"/>
    <ellipse cx="85" cy="42" rx="36" ry="30" fill="#fff" opacity="0.92"/>
    <ellipse cx="135" cy="55" rx="28" ry="22" fill="#fff" opacity="0.92"/>
    <ellipse cx="65" cy="62" rx="24" ry="18" fill="#f0f0f0" opacity="0.88"/>
  </svg>

  <!-- 小鸟 -->
  <div class="bird">🐦</div>

  <!-- 草地 -->
  <div class="grass"></div>

  <!-- 波浪 -->
  <svg class="wave" viewBox="0 0 1200 20" preserveAspectRatio="none">
    <path d="M0,10 Q150,0 300,10 T600,10 T900,10 T1200,10 V20 H0 Z" fill="#fff"/>
  </svg>

  <!-- 小花 -->
  <div class="flower flower-1">🌻</div>
  <div class="flower flower-2">🌷</div>
  <div class="flower flower-3">🌼</div>
  <div class="flower flower-4">🌹</div>
  <div class="flower flower-5">🌸</div>

  <!-- 标题 -->
  <div class="title-container">
    <div class="title-main">嗨，小朋友们！</div>
    <div class="title-sub">Let's learn English! 🌟</div>
  </div>

  <!-- 进度条 -->
  <div class="progress-bar"></div>

  <script>
    // 页面加载后自动播放旁白
    window.addEventListener('load', () => {
      setTimeout(() => {
        const u = new SpeechSynthesisUtterance("嗨，小朋友们！");
        u.lang = 'zh-CN';
        u.rate = 0.9;
        u.pitch = 1.2; // 略高音调，更像对小朋友说话
        speechSynthesis.speak(u);
      }, 400);
    });

    // 点击页面也可以重播
    document.body.addEventListener('click', () => {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance("嗨，小朋友们！");
      u.lang = 'zh-CN';
      u.rate = 0.9;
      u.pitch = 1.2;
      speechSynthesis.speak(u);
    });
  </script>

</body>
</html>
