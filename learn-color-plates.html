<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍽️ 学习颜色 · 彩色盘子 Learn Colors on Plates</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(circle at 20% 10%, #fff3e0 0%, transparent 50%),
      radial-gradient(circle at 80% 0%, #fce4ec 0%, transparent 50%),
      radial-gradient(circle at 50% 100%, #e0f7fa 0%, transparent 50%),
      #fff8e1;
    min-height: 100vh;
    overflow-x: hidden;
    user-select: none;
  }

  header {
    text-align: center;
    padding: 24px 16px 12px;
  }

  h1 {
    font-size: clamp(28px, 6vw, 44px);
    color: #e65100;
    text-shadow: 3px 3px 0 #fff, 6px 6px 0 rgba(0,0,0,0.08);
    letter-spacing: 2px;
    animation: bounce-title 2s ease-in-out infinite;
  }

  @keyframes bounce-title {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-6px) rotate(1deg); }
  }

  .subtitle {
    font-size: clamp(14px, 3.5vw, 20px);
    color: #f57c00;
    margin-top: 6px;
    font-weight: 600;
  }

  .mode-switch {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin: 16px 0 8px;
  }

  .mode-btn {
    padding: 12px 28px;
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 800;
    border: 4px solid #fff;
    border-radius: 50px;
    background: #fff;
    color: #e65100;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.1), 0 8px 16px rgba(0,0,0,0.08);
    transition: all 0.15s;
  }

  .mode-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.1), 0 4px 8px rgba(0,0,0,0.08);
  }

  .mode-btn.active {
    background: linear-gradient(135deg, #e65100, #d81b60);
    color: #fff;
  }

  .voice-settings {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px 18px;
    flex-wrap: wrap;
    padding: 8px 16px 16px;
    max-width: 900px;
    margin: 0 auto;
  }

  .voice-group {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.75);
    padding: 6px 8px;
    border-radius: 50px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.06);
  }

  .voice-group-label {
    font-size: 13px;
    font-weight: 800;
    color: #e65100;
    padding-left: 6px;
  }

  .voice-toggle {
    padding: 7px 16px;
    font-size: 14px;
    font-weight: 700;
    border: none;
    border-radius: 50px;
    background: transparent;
    color: #999;
    cursor: pointer;
    transition: all 0.15s;
  }

  .voice-toggle.active {
    background: #fff;
    color: #e65100;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  .voice-toggle:active {
    transform: scale(0.94);
  }

  /* 盘子网格 */
  .plates-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 22px;
    padding: 20px;
    max-width: 1000px;
    margin: 0 auto;
  }

  .plate-card {
    background: #fff;
    border-radius: 28px;
    padding: 18px 12px 16px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 8px 0 rgba(0,0,0,0.08), 0 12px 24px rgba(0,0,0,0.06);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
    border: 4px solid #fff;
  }

  .plate-card:hover {
    transform: translateY(-6px) rotate(-2deg);
  }

  .plate-card:active {
    transform: translateY(2px) scale(0.97);
    box-shadow: 0 3px 0 rgba(0,0,0,0.08), 0 6px 12px rgba(0,0,0,0.06);
  }

  .plate-svg {
    width: 120px;
    height: 120px;
    margin: 0 auto 10px;
    display: block;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.2));
    animation: plate-wiggle 3s ease-in-out infinite;
  }

  @keyframes plate-wiggle {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-6px) rotate(-4deg); }
    75% { transform: translateY(-6px) rotate(4deg); }
  }

  .plate-svg svg {
    width: 100%;
    height: 100%;
  }

  .en-name {
    font-size: clamp(20px, 4.5vw, 26px);
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1.2;
  }

  .cn-name {
    font-size: clamp(15px, 3.5vw, 18px);
    color: #777;
    margin-top: 4px;
    font-weight: 700;
  }

  .speaker-icon {
    display: inline-block;
    font-size: 17px;
    margin-left: 4px;
    vertical-align: middle;
  }

  /* 弹出大字提示 */
  .pop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }

  .pop-overlay.show {
    display: flex;
    animation: fade-in 0.2s;
  }

  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .pop-card {
    background: #fff;
    border-radius: 42px;
    padding: 42px 52px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-width: 90vw;
    position: relative;
  }

  .pop-speak-btn {
    margin-top: 20px;
    padding: 14px 36px;
    font-size: clamp(20px, 5vw, 28px);
    font-weight: 900;
    border: 4px solid #fff;
    border-radius: 50px;
    background: linear-gradient(135deg, #ec407a, #d81b60);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 0 #880e4f, 0 10px 20px rgba(0,0,0,0.15);
    transition: all 0.12s;
    letter-spacing: 1px;
  }
  .pop-speak-btn:hover { transform: translateY(-2px); }
  .pop-speak-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #880e4f, 0 4px 8px rgba(0,0,0,0.15);
  }
  .pop-close-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 3px solid #fff;
    background: linear-gradient(135deg, #ef5350, #c62828);
    color: #fff;
    font-size: 24px;
    font-weight: 900;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 0 #8b0000, 0 6px 12px rgba(0,0,0,0.18);
    transition: all 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .pop-close-btn:hover { transform: translateY(-2px) rotate(90deg); }
  .pop-close-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #8b0000, 0 3px 6px rgba(0,0,0,0.18);
  }

  @keyframes pop-in {
    from { transform: scale(0.3); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .pop-plate {
    width: 180px;
    height: 180px;
    margin: 0 auto 18px;
    filter: drop-shadow(0 10px 16px rgba(0,0,0,0.25));
    animation: plate-wiggle 2s ease-in-out infinite;
  }

  .pop-plate svg {
    width: 100%;
    height: 100%;
  }

  .pop-en {
    font-size: clamp(40px, 11vw, 64px);
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1.1;
  }

  .pop-cn {
    font-size: clamp(24px, 6vw, 36px);
    color: #777;
    margin-top: 8px;
    font-weight: 800;
  }

  .pop-hint {
    font-size: 14px;
    color: #bbb;
    margin-top: 20px;
  }

  /* 游戏模式 */
  .game-area {
    display: none;
    padding: 30px 20px;
    max-width: 800px;
    margin: 0 auto;
    text-align: center;
  }

  .game-area.show {
    display: block;
  }

  .question-box {
    background: #fff;
    border-radius: 30px;
    padding: 28px 24px;
    margin-bottom: 28px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.08), 0 12px 24px rgba(0,0,0,0.06);
  }

  .question-label {
    font-size: clamp(16px, 4vw, 20px);
    color: #d81b60;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .question-text {
    font-size: clamp(30px, 8vw, 52px);
    font-weight: 900;
  }

  .question-cn {
    font-size: clamp(20px, 5vw, 28px);
    color: #666;
    margin-top: 8px;
    font-weight: 700;
  }

  .listen-btn {
    margin-top: 14px;
    padding: 10px 22px;
    font-size: 16px;
    font-weight: 700;
    border: 3px solid #e65100;
    border-radius: 50px;
    background: #fff;
    color: #e65100;
    cursor: pointer;
    transition: all 0.15s;
  }

  .listen-btn:active {
    transform: scale(0.95);
  }

  .game-options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 18px;
  }

  .option-card {
    border-radius: 26px;
    cursor: pointer;
    background: #fff;
    padding: 14px 10px 12px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.08), 0 10px 20px rgba(0,0,0,0.08);
    transition: transform 0.15s, box-shadow 0.15s;
    border: 5px solid #fff;
    text-align: center;
  }

  .option-card .opt-plate {
    width: 84px;
    height: 84px;
    margin: 0 auto 6px;
  }
  .option-card .opt-plate svg { width: 100%; height: 100%; }

  .option-card .opt-text {
    font-size: 16px;
    font-weight: 800;
    color: #333;
  }

  .option-card:hover {
    transform: translateY(-3px);
  }

  .option-card:active {
    transform: translateY(2px);
    box-shadow: 0 3px 0 rgba(0,0,0,0.08), 0 5px 10px rgba(0,0,0,0.08);
  }

  .option-card.correct {
    animation: correct-pulse 0.6s;
    border-color: #43a047;
  }

  .option-card.wrong {
    animation: wrong-shake 0.5s;
    border-color: #e53935;
  }

  @keyframes correct-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  @keyframes wrong-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-12px); }
    75% { transform: translateX(12px); }
  }

  .score-box {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    padding: 10px 22px;
    border-radius: 50px;
    font-size: clamp(18px, 4.5vw, 24px);
    font-weight: 800;
    color: #e65100;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08);
    margin-bottom: 20px;
  }

  .feedback {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: clamp(40px, 12vw, 80px);
    font-weight: 900;
    z-index: 200;
    pointer-events: none;
    text-shadow: 4px 4px 0 #fff;
  }

  .feedback.show {
    animation: feedback-pop 1.2s ease-out forwards;
  }

  @keyframes feedback-pop {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-20deg); opacity: 0; }
    30% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); opacity: 1; }
    70% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.4) rotate(0deg); opacity: 0; }
  }

  .confetti {
    position: fixed;
    width: 12px;
    height: 12px;
    pointer-events: none;
    z-index: 150;
  }

  .footer-tip {
    text-align: center;
    padding: 20px;
    color: #999;
    font-size: 14px;
    font-weight: 600;
  }

  @media (max-width: 480px) {
    .plates-grid { gap: 14px; padding: 14px; grid-template-columns: repeat(2, 1fr); }
    .plate-svg { width: 96px; height: 96px; }
    .pop-card { padding: 30px 28px; }
    .pop-plate { width: 140px; height: 140px; }
    .option-card { padding: 10px 8px 8px; }
    .option-card .opt-plate { width: 66px; height: 66px; }
  }
</style>
</head>
<body>

<header>
  <h1>🍽️ 彩色盘子学颜色</h1>
  <div class="subtitle">Learn Colors with Plates · 点一点漂亮的盘子!</div>
</header>

<div class="mode-switch">
  <button class="mode-btn active" id="learnModeBtn" onclick="switchMode('learn')">📖 学习</button>
  <button class="mode-btn" id="gameModeBtn" onclick="switchMode('game')">🎮 游戏</button>
</div>

<div class="voice-settings">
  <div class="voice-group">
    <span class="voice-group-label">🗣️ 声音</span>
    <button class="voice-toggle" id="voiceMaleBtn" onclick="setGender('male')">👨 男声</button>
    <button class="voice-toggle active" id="voiceFemaleBtn" onclick="setGender('female')">👩 女声</button>
  </div>
  <div class="voice-group">
    <span class="voice-group-label">🌍 口音</span>
    <button class="voice-toggle active" id="accentUSBtn" onclick="setAccent('us')">🇺🇸 美式</button>
    <button class="voice-toggle" id="accentUKBtn" onclick="setAccent('uk')">🇬🇧 英式</button>
  </div>
  <button class="voice-toggle" id="testVoiceBtn" style="background:#fff;color:#e65100;box-shadow:0 2px 6px rgba(0,0,0,0.1);" onclick="testVoice()">🔊 试听</button>
</div>

<!-- 学习模式：彩色盘子 -->
<section class="plates-grid" id="learnArea"></section>

<!-- 游戏模式 -->
<section class="game-area" id="gameArea">
  <div class="score-box">⭐ 得分: <span id="scoreNum">0</span></div>
  <div class="question-box">
    <div class="question-label">👉 听一听,找一找哪个是这个颜色!</div>
    <div class="question-text" id="questionText">Red</div>
    <div class="question-cn" id="questionCn">红色</div>
    <button class="listen-btn" onclick="speakCurrentQuestion()">🔊 再听一次</button>
  </div>
  <div class="game-options" id="gameOptions"></div>
</section>

<!-- 弹窗 -->
<div class="pop-overlay" id="popOverlay" onclick="closePop()">
  <div class="pop-card" onclick="event.stopPropagation()">
    <button class="pop-close-btn" onclick="closePop()" aria-label="关闭">✕</button>
    <div class="pop-plate" id="popPlate"></div>
    <div class="pop-en" id="popEn">Red</div>
    <div class="pop-cn" id="popCn">红色</div>
    <div><button class="pop-speak-btn" onclick="speakPop()">🔊 再听一次</button></div>
    <div class="pop-hint">点击空白处关闭 · Tap to close</div>
  </div>
</div>

<div class="feedback" id="feedback"></div>

<div class="footer-tip">💡 提示:盘子里还有小水果和小蛋糕,一起点一点看一看!🍰🍓🍒</div>

<script>
  // 生成盘子 SVG 的通用函数(外圈金边 + 内圈花纹 + 盘子主色 + 中心小装饰)
  function makePlateSVG(mainColor, accentHex, decoShape) {
    // decoShape: cake / strawberry / cherry / star / heart / leaf / dot / donut / grape / orange / lemon / apple
    const deco = {
      cake: `<path d="M50 58 L66 58 L64 46 L52 46 Z" fill="#fff" stroke="#c62828" stroke-width="1"/><rect x="50" y="42" width="16" height="4" rx="1" fill="#ef5350"/><rect x="50" y="56" width="16" height="2" fill="#c62828"/>`,
      strawberry: `<path d="M58 42 Q 50 62 42 42 Q 50 50 58 42 Z" fill="#ef5350"/><circle cx="52" cy="46" r="0.7" fill="#fff"/><circle cx="48" cy="47" r="0.7" fill="#fff"/><circle cx="50" cy="44" r="0.7" fill="#fff"/><path d="M48 42 L50 38 L52 42 Z" fill="#66bb6a"/>`,
      cherry: `<circle cx="47" cy="52" r="4" fill="#e53935"/><circle cx="55" cy="52" r="4" fill="#d81b60"/><path d="M47 48 Q 51 40 55 48" stroke="#6d4c41" stroke-width="1.2" fill="none"/><path d="M51 40 L54 36 L52 42 Z" fill="#66bb6a"/>`,
      star: `<polygon points="50,40 52,48 60,48 53,53 56,61 50,56 44,61 47,53 40,48 48,48" fill="${accentHex}"/>`,
      heart: `<path d="M50 58 C 44 52 40 48 44 44 C 47 41 50 44 50 47 C 50 44 53 41 56 44 C 60 48 56 52 50 58 Z" fill="${accentHex}"/>`,
      leaf: `<path d="M50 40 Q 62 50 50 62 Q 38 50 50 40 Z" fill="${accentHex}"/><path d="M50 44 L50 58" stroke="#fff" stroke-width="1.2"/>`,
      dot: `<circle cx="50" cy="51" r="5" fill="${accentHex}"/>`,
      donut: `<circle cx="50" cy="51" r="8" fill="#ffb74d"/><circle cx="50" cy="51" r="3.5" fill="white"/>`,
      grape: `<circle cx="47" cy="47" r="2.5" fill="#8e24aa"/><circle cx="53" cy="47" r="2.5" fill="#9c27b0"/><circle cx="50" cy="51" r="2.5" fill="#7b1fa2"/><circle cx="47" cy="55" r="2.5" fill="#8e24aa"/><circle cx="53" cy="55" r="2.5" fill="#9c27b0"/><path d="M50 44 L51 40" stroke="#6d4c41" stroke-width="1"/>`,
      orange: `<circle cx="50" cy="51" r="6" fill="#ff9800"/><circle cx="50" cy="51" r="6" fill="none" stroke="#fff" stroke-width="0.8"/><path d="M50 45 L50 57 M44 51 L56 51 M46 47 L54 55 M54 47 L46 55" stroke="rgba(255,255,255,0.6)" stroke-width="0.5"/>`,
      lemon: `<ellipse cx="50" cy="51" rx="7" ry="5" fill="#fdd835" transform="rotate(-20 50 51)"/><ellipse cx="50" cy="51" rx="7" ry="5" fill="none" stroke="#fbc02d" stroke-width="0.8" transform="rotate(-20 50 51)"/>`,
      apple: `<path d="M45 46 C 42 44 42 56 50 60 C 58 56 58 44 55 46 C 54 43 51 43 50 46 C 49 43 46 43 45 46 Z" fill="#e53935"/><path d="M50 46 Q 52 40 54 40" stroke="#6d4c41" stroke-width="1.4" fill="none"/><path d="M52 41 L55 39 L53 43 Z" fill="#66bb6a"/>`
    };
    const innerDeco = deco[decoShape] || deco.dot;

    // 盘子 SVG 结构(100x100 viewBox):
    // 1. 外阴影金边(最外层深色描边的感觉)
    // 2. 白色餐盘边框(宽边)
    // 3. 内层彩色盘面
    // 4. 装饰花纹(金色小圆点围绕)
    // 5. 中心食物装饰
    return `
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 最外圈阴影+金边 -->
  <circle cx="50" cy="50" r="47" fill="#fffde7" stroke="#fdd835" stroke-width="2"/>
  <circle cx="50" cy="50" r="44" fill="#fff" stroke="#ffe082" stroke-width="1"/>
  <!-- 宽白边 -->
  <circle cx="50" cy="50" r="38" fill="${mainColor}" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
  <!-- 白色窄内圈 -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
  <!-- 围绕的金点装饰 -->
  <g fill="#ffd54f">
    <circle cx="50" cy="18" r="1.6"/>
    <circle cx="72" cy="27" r="1.6"/>
    <circle cx="82" cy="50" r="1.6"/>
    <circle cx="72" cy="73" r="1.6"/>
    <circle cx="50" cy="82" r="1.6"/>
    <circle cx="28" cy="73" r="1.6"/>
    <circle cx="18" cy="50" r="1.6"/>
    <circle cx="28" cy="27" r="1.6"/>
  </g>
  <!-- 中心食物 -->
  ${innerDeco}
</svg>`;
  }

  // 12 种颜色,配不同盘子和装饰
  const colors = [
    { en: "Red",       cn: "红色", main: "#ef5350", accent: "#ffffff",  deco: "apple" },
    { en: "Orange",    cn: "橙色", main: "#ffa726", accent: "#fff3e0",  deco: "orange" },
    { en: "Yellow",    cn: "黄色", main: "#ffee58", accent: "#fff59d",  deco: "lemon" },
    { en: "Green",     cn: "绿色", main: "#66bb6a", accent: "#ffffff",  deco: "leaf" },
    { en: "Blue",      cn: "蓝色", main: "#42a5f5", accent: "#ffffff",  deco: "donut" },
    { en: "Purple",    cn: "紫色", main: "#ab47bc", accent: "#f3e5f5",  deco: "grape" },
    { en: "Pink",      cn: "粉色", main: "#f48fb1", accent: "#ffffff",  deco: "cake" },
    { en: "Brown",     cn: "棕色", main: "#8d6e63", accent: "#fff3e0",  deco: "dot" },
    { en: "Black",     cn: "黑色", main: "#424242", accent: "#ffeb3b",  deco: "star" },
    { en: "White",     cn: "白色", main: "#fafafa", accent: "#f06292",  deco: "heart" },
    { en: "Gray",      cn: "灰色", main: "#9e9e9e", accent: "#ffffff",  deco: "dot" },
    { en: "Gold",      cn: "金色", main: "#ffd54f", accent: "#fff176",  deco: "cherry" }
  ];

  let score = 0;
  let currentShowItem = null;
  let currentAnswer = null;

  // 初始化学习区
  function initLearnArea() {
    const area = document.getElementById('learnArea');
    area.innerHTML = colors.map((c, i) => {
      const svg = makePlateSVG(c.main, c.accent, c.deco);
      return `
      <div class="plate-card" onclick="showPlate(${i})">
        <div class="plate-svg">${svg}</div>
        <div class="en-name" style="color:${c.main === '#fafafa' ? '#bdbdbd' : c.main === '#ffee58' ? '#f9a825' : c.main};">${c.en}<span class="speaker-icon">🔊</span></div>
        <div class="cn-name">${c.cn}</div>
      </div>`;
    }).join('');
  }

  function showPlate(i) {
    const c = colors[i];
    currentShowItem = c;
    document.getElementById('popPlate').innerHTML = makePlateSVG(c.main, c.accent, c.deco);
    const popEn = document.getElementById('popEn');
    popEn.textContent = c.en;
    popEn.style.color = c.main === '#fafafa' ? '#bdbdbd' : c.main === '#ffee58' ? '#f9a825' : c.main;
    document.getElementById('popCn').textContent = c.cn;
    document.getElementById('popOverlay').classList.add('show');
    speak(c.en);
  }

  function closePop() {
    document.getElementById('popOverlay').classList.remove('show');
  }

  function speakPop(){ if(currentShowItem) speak(currentShowItem.en); }

  // ===== 声音设置 =====
  let voiceGender = localStorage.getItem('vcp_gender') || 'female';
  let voiceAccent = localStorage.getItem('vcp_accent') || 'us';
  let cachedVoices = [];

  const MALE_NAMES = ['alex','fred','tom','ralph','aaron','luca','markus','gordon','james','daniel','oliver','arthur','george','ryan','guy','reed','rocko','david','mark','eric','benjamin','jacob','liam','noah'];
  const FEMALE_NAMES = ['samantha','victoria','karen','moira','tessa','zoe','fiona','veena','kate','serena','hannah','amy','emma','joanna','kendra','kimberly','salli','hazel','sonia','libby','aria','jenny','michelle','linda','heather','susan','lisa','zira','nancy','amber'];

  function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    cachedVoices = window.speechSynthesis.getVoices();
  }

  function pickVoice(accent, gender) {
    const voices = cachedVoices.length ? cachedVoices : window.speechSynthesis.getVoices();
    const langPrefix = accent === 'uk' ? 'en-GB' : 'en-US';
    let langVoices = voices.filter(v => v.lang === langPrefix);
    if (langVoices.length === 0) langVoices = voices.filter(v => v.lang.toLowerCase().startsWith(langPrefix.toLowerCase()));
    if (langVoices.length === 0) langVoices = voices.filter(v => v.lang.toLowerCase().startsWith('en'));
    if (langVoices.length === 0) return null;

    const preferred = gender === 'male' ? MALE_NAMES : FEMALE_NAMES;
    for (const name of preferred) {
      const match = langVoices.find(v => v.name.toLowerCase().includes(name));
      if (match) return match;
    }
    const genderHint = gender === 'male' ? /(male|man|\bm\b)/ : /(female|woman|\bf\b)/;
    const hinted = langVoices.find(v => genderHint.test(v.name.toLowerCase()));
    if (hinted) return hinted;

    if (langVoices.length === 1) return langVoices[0];
    const sorted = [...langVoices].sort((a,b) => a.name.localeCompare(b.name));
    return gender === 'male' ? sorted[0] : sorted[sorted.length - 1];
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const voice = pickVoice(voiceAccent, voiceGender);
    if (voice) { u.voice = voice; u.lang = voice.lang; }
    else { u.lang = voiceAccent === 'uk' ? 'en-GB' : 'en-US'; }
    u.rate = 0.8;
    u.pitch = voiceGender === 'male' ? 0.9 : 1.15;
    window.speechSynthesis.speak(u);
  }

  function setGender(g) {
    voiceGender = g;
    localStorage.setItem('vcp_gender', g);
    document.getElementById('voiceMaleBtn').classList.toggle('active', g === 'male');
    document.getElementById('voiceFemaleBtn').classList.toggle('active', g === 'female');
  }

  function setAccent(a) {
    voiceAccent = a;
    localStorage.setItem('vcp_accent', a);
    document.getElementById('accentUSBtn').classList.toggle('active', a === 'us');
    document.getElementById('accentUKBtn').classList.toggle('active', a === 'uk');
  }

  function testVoice() {
    speak("Hello! Let's learn colors with plates!");
  }

  if ('speechSynthesis' in window) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  // 模式切换
  function switchMode(mode) {
    const learnBtn = document.getElementById('learnModeBtn');
    const gameBtn = document.getElementById('gameModeBtn');
    const learnArea = document.getElementById('learnArea');
    const gameArea = document.getElementById('gameArea');
    if (mode === 'learn') {
      learnBtn.classList.add('active');
      gameBtn.classList.remove('active');
      learnArea.style.display = 'grid';
      gameArea.classList.remove('show');
    } else {
      gameBtn.classList.add('active');
      learnBtn.classList.remove('active');
      learnArea.style.display = 'none';
      gameArea.classList.add('show');
      newQuestion();
    }
  }

  function newQuestion() {
    const shuffled = [...colors].sort(() => Math.random() - 0.5);
    const options = shuffled.slice(0, 4);
    currentAnswer = options[Math.floor(Math.random() * options.length)];

    const qColor = currentAnswer.main === '#fafafa' ? '#bdbdbd' : currentAnswer.main === '#ffee58' ? '#f9a825' : currentAnswer.main;
    document.getElementById('questionText').textContent = currentAnswer.en;
    document.getElementById('questionText').style.color = qColor;
    document.getElementById('questionCn').textContent = currentAnswer.cn;

    const optArea = document.getElementById('gameOptions');
    optArea.innerHTML = options.map(c => {
      const svg = makePlateSVG(c.main, c.accent, c.deco);
      return `
      <div class="option-card" onclick="checkAnswer('${c.en}', this)">
        <div class="opt-plate">${svg}</div>
        <div class="opt-text" style="color:${c.main === '#fafafa' ? '#bdbdbd' : c.main === '#ffee58' ? '#f9a825' : c.main};">${c.en}</div>
      </div>`;
    }).join('');

    setTimeout(() => speak(currentAnswer.en), 300);
  }

  function speakCurrentQuestion() {
    if (currentAnswer) speak(currentAnswer.en);
  }

  function checkAnswer(answer, el) {
    if (answer === currentAnswer.en) {
      el.classList.add('correct');
      score++;
      document.getElementById('scoreNum').textContent = score;
      showFeedback("✅ 真棒!", "#43a047");
      launchConfetti();
      speak(currentAnswer.en);
      setTimeout(() => { newQuestion(); }, 1500);
    } else {
      el.classList.add('wrong');
      showFeedback("😢 再试试!", "#e53935");
      setTimeout(() => el.classList.remove('wrong'), 600);
    }
  }

  function showFeedback(text, color) {
    const fb = document.getElementById('feedback');
    fb.textContent = text;
    fb.style.color = color;
    fb.classList.remove('show');
    void fb.offsetWidth;
    fb.classList.add('show');
  }

  function launchConfetti() {
    const colorsList = ['#e65100','#f57c00','#d81b60','#c2185b','#ffa000','#fbc02d','#ef5350','#42a5f5','#66bb6a'];
    for (let i = 0; i < 45; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.background = colorsList[Math.floor(Math.random() * colorsList.length)];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-20px';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      c.style.transform = `rotate(${Math.random()*360}deg)`;
      document.body.appendChild(c);

      const duration = 1500 + Math.random() * 1700;
      const drift = (Math.random() - 0.5) * 220;
      c.animate([
        { transform: c.style.transform, top: '-20px', opacity: 1 },
        { transform: `translateX(${drift}px) rotate(${720 + Math.random()*360}deg)`, top: '100vh', opacity: 0.8 }
      ], { duration, easing: 'cubic-bezier(0.3, 0.7, 0.4, 1)' });

      setTimeout(() => c.remove(), duration);
    }
  }

  initLearnArea();
  setGender(voiceGender);
  setAccent(voiceAccent);
</script>

</body>
