<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌈 学习颜色 Learn Colors</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #fef9e7 0%, #fde2ff 50%, #e0f7ff 100%);
    min-height: 100vh;
    overflow-x: hidden;
    user-select: none;
  }

  /* 顶部标题 */
  header {
    text-align: center;
    padding: 24px 16px 12px;
    position: relative;
  }

  h1 {
    font-size: clamp(28px, 6vw, 44px);
    color: #ff5e8a;
    text-shadow: 3px 3px 0 #fff, 6px 6px 0 rgba(0,0,0,0.08);
    letter-spacing: 2px;
    animation: bounce-title 2s ease-in-out infinite;
  }

  @keyframes bounce-title {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-6px) rotate(1deg); }
  }

  .subtitle {
    font-size: clamp(14px, 3.5vw, 20px);
    color: #7c6bad;
    margin-top: 6px;
    font-weight: 600;
  }

  /* 模式切换按钮 */
  .mode-switch {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin: 16px 0 8px;
  }

  .mode-btn {
    padding: 12px 28px;
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 800;
    border: 4px solid #fff;
    border-radius: 50px;
    background: #fff;
    color: #7c6bad;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.1), 0 8px 16px rgba(0,0,0,0.08);
    transition: all 0.15s;
  }

  .mode-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.1), 0 4px 8px rgba(0,0,0,0.08);
  }

  .mode-btn.active {
    background: linear-gradient(135deg, #ff5e8a, #ff9a3c);
    color: #fff;
    border-color: #fff;
  }

  /* 声音设置栏 */
  .voice-settings {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px 18px;
    flex-wrap: wrap;
    padding: 8px 16px 16px;
    max-width: 900px;
    margin: 0 auto;
  }

  .voice-group {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.7);
    padding: 6px 8px;
    border-radius: 50px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.06);
  }

  .voice-group-label {
    font-size: 13px;
    font-weight: 800;
    color: #7c6bad;
    padding-left: 6px;
  }

  .voice-toggle {
    padding: 7px 16px;
    font-size: 14px;
    font-weight: 700;
    border: none;
    border-radius: 50px;
    background: transparent;
    color: #999;
    cursor: pointer;
    transition: all 0.15s;
  }

  .voice-toggle.active {
    background: #fff;
    color: #ff5e8a;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  .voice-toggle:active {
    transform: scale(0.94);
  }

  /* 颜色网格 */
  .colors-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 18px;
    padding: 20px;
    max-width: 900px;
    margin: 0 auto;
  }

  .color-card {
    background: #fff;
    border-radius: 28px;
    padding: 18px 12px 16px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 8px 0 rgba(0,0,0,0.08), 0 12px 24px rgba(0,0,0,0.06);
    transition: transform 0.2s, box-shadow 0.2s;
    border: 4px solid #fff;
  }

  .color-card:hover {
    transform: translateY(-4px) rotate(-1deg);
  }

  .color-card:active {
    transform: translateY(2px);
    box-shadow: 0 3px 0 rgba(0,0,0,0.08), 0 6px 12px rgba(0,0,0,0.06);
  }

  .color-blob {
    width: 90px;
    height: 90px;
    margin: 0 auto 12px;
    border-radius: 50%;
    box-shadow: inset -8px -8px 16px rgba(0,0,0,0.15), inset 6px 6px 12px rgba(255,255,255,0.4);
    position: relative;
    animation: blob-float 3s ease-in-out infinite;
  }

  .color-blob::after {
    content: "";
    position: absolute;
    top: 18%;
    left: 22%;
    width: 24%;
    height: 18%;
    background: rgba(255,255,255,0.6);
    border-radius: 50%;
    filter: blur(2px);
  }

  @keyframes blob-float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-6px) scale(1.04); }
  }

  .en-name {
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 800;
    color: #333;
    letter-spacing: 1px;
  }

  .cn-name {
    font-size: clamp(15px, 3.5vw, 18px);
    color: #888;
    margin-top: 4px;
    font-weight: 600;
  }

  .speaker-icon {
    display: inline-block;
    font-size: 18px;
    margin-left: 4px;
    vertical-align: middle;
  }

  /* 弹出大字提示 */
  .pop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }

  .pop-overlay.show {
    display: flex;
    animation: fade-in 0.2s;
  }

  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .pop-card {
    background: #fff;
    border-radius: 40px;
    padding: 40px 50px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-width: 90vw;
    position: relative;
  }

  /* 弹窗里的重复播放按钮 */
  .pop-speak-btn {
    margin-top: 20px;
    padding: 14px 36px;
    font-size: clamp(20px, 5vw, 28px);
    font-weight: 900;
    border: 4px solid #fff;
    border-radius: 50px;
    background: linear-gradient(135deg, #ec407a, #d81b60);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 0 #880e4f, 0 10px 20px rgba(0,0,0,0.15);
    transition: all 0.12s;
    letter-spacing: 1px;
  }
  .pop-speak-btn:hover { transform: translateY(-2px); }
  .pop-speak-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #880e4f, 0 4px 8px rgba(0,0,0,0.15);
  }

  /* 右上角关闭按钮 */
  .pop-close-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 3px solid #fff;
    background: linear-gradient(135deg, #ef5350, #c62828);
    color: #fff;
    font-size: 24px;
    font-weight: 900;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 0 #8b0000, 0 6px 12px rgba(0,0,0,0.18);
    transition: all 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .pop-close-btn:hover { transform: translateY(-2px) rotate(90deg); }
  .pop-close-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #8b0000, 0 3px 6px rgba(0,0,0,0.18);
  }

  @keyframes pop-in {
    from { transform: scale(0.3); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .pop-blob {
    width: 160px;
    height: 160px;
    margin: 0 auto 20px;
    border-radius: 50%;
    box-shadow: inset -12px -12px 24px rgba(0,0,0,0.15), inset 8px 8px 16px rgba(255,255,255,0.4);
    animation: blob-float 2s ease-in-out infinite;
  }

  .pop-en {
    font-size: clamp(36px, 10vw, 56px);
    font-weight: 900;
    color: #333;
    letter-spacing: 2px;
  }

  .pop-cn {
    font-size: clamp(22px, 6vw, 32px);
    color: #888;
    margin-top: 8px;
    font-weight: 700;
  }

  .pop-hint {
    font-size: 14px;
    color: #bbb;
    margin-top: 18px;
  }

  /* 游戏模式 */
  .game-area {
    display: none;
    padding: 30px 20px;
    max-width: 800px;
    margin: 0 auto;
    text-align: center;
  }

  .game-area.show {
    display: block;
  }

  .question-box {
    background: #fff;
    border-radius: 30px;
    padding: 28px 24px;
    margin-bottom: 28px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.08), 0 12px 24px rgba(0,0,0,0.06);
  }

  .question-label {
    font-size: clamp(16px, 4vw, 20px);
    color: #7c6bad;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .question-text {
    font-size: clamp(26px, 7vw, 40px);
    font-weight: 900;
    color: #ff5e8a;
  }

  .question-en {
    font-size: clamp(20px, 5vw, 28px);
    color: #555;
    margin-top: 8px;
    font-weight: 700;
  }

  .listen-btn {
    margin-top: 14px;
    padding: 10px 22px;
    font-size: 16px;
    font-weight: 700;
    border: 3px solid #7c6bad;
    border-radius: 50px;
    background: #fff;
    color: #7c6bad;
    cursor: pointer;
    transition: all 0.15s;
  }

  .listen-btn:active {
    transform: scale(0.95);
  }

  .game-options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 16px;
  }

  .option-card {
    height: 110px;
    border-radius: 24px;
    cursor: pointer;
    box-shadow: 0 8px 0 rgba(0,0,0,0.12), 0 10px 20px rgba(0,0,0,0.1);
    transition: transform 0.15s, box-shadow 0.15s;
    border: 5px solid #fff;
    position: relative;
    overflow: hidden;
  }

  .option-card:hover {
    transform: translateY(-3px);
  }

  .option-card:active {
    transform: translateY(2px);
    box-shadow: 0 3px 0 rgba(0,0,0,0.12), 0 5px 10px rgba(0,0,0,0.1);
  }

  .option-card.correct {
    animation: correct-pulse 0.6s;
  }

  .option-card.wrong {
    animation: wrong-shake 0.5s;
  }

  @keyframes correct-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); border-color: #4caf50; }
  }

  @keyframes wrong-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); border-color: #f44336; }
    75% { transform: translateX(10px); border-color: #f44336; }
  }

  .score-box {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    padding: 10px 22px;
    border-radius: 50px;
    font-size: clamp(18px, 4.5vw, 24px);
    font-weight: 800;
    color: #ff9a3c;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08);
    margin-bottom: 20px;
  }

  /* 反馈文字 */
  .feedback {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: clamp(40px, 12vw, 80px);
    font-weight: 900;
    z-index: 200;
    pointer-events: none;
    text-shadow: 4px 4px 0 #fff;
  }

  .feedback.show {
    animation: feedback-pop 1.2s ease-out forwards;
  }

  @keyframes feedback-pop {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-20deg); opacity: 0; }
    30% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); opacity: 1; }
    70% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.4) rotate(0deg); opacity: 0; }
  }

  /* 五彩纸屑 */
  .confetti {
    position: fixed;
    width: 12px;
    height: 12px;
    pointer-events: none;
    z-index: 150;
  }

  /* 底部说明 */
  .footer-tip {
    text-align: center;
    padding: 20px;
    color: #999;
    font-size: 14px;
    font-weight: 600;
  }

  @media (max-width: 480px) {
    .colors-grid { gap: 12px; padding: 14px; }
    .color-blob { width: 70px; height: 70px; }
    .pop-card { padding: 30px 28px; }
    .pop-blob { width: 130px; height: 130px; }
  }
</style>
</head>
<body>

<header>
  <h1>🌈 学习颜色</h1>
  <div class="subtitle">Learn Colors · 点一点,听一听,玩一玩!</div>
</header>

<div class="mode-switch">
  <button class="mode-btn active" id="learnModeBtn" onclick="switchMode('learn')">📖 学习</button>
  <button class="mode-btn" id="gameModeBtn" onclick="switchMode('game')">🎮 游戏</button>
</div>

<div class="voice-settings">
  <div class="voice-group">
    <span class="voice-group-label">🗣️ 声音</span>
    <button class="voice-toggle" id="voiceMaleBtn" onclick="setGender('male')">👨 男声</button>
    <button class="voice-toggle active" id="voiceFemaleBtn" onclick="setGender('female')">👩 女声</button>
  </div>
  <div class="voice-group">
    <span class="voice-group-label">🌍 口音</span>
    <button class="voice-toggle active" id="accentUSBtn" onclick="setAccent('us')">🇺🇸 美式</button>
    <button class="voice-toggle" id="accentUKBtn" onclick="setAccent('uk')">🇬🇧 英式</button>
  </div>
  <button class="voice-toggle" id="testVoiceBtn" style="background:#fff;color:#7c6bad;box-shadow:0 2px 6px rgba(0,0,0,0.1);" onclick="testVoice()">🔊 试听</button>
</div>

<!-- 学习模式 -->
<section class="colors-grid" id="learnArea"></section>

<!-- 游戏模式 -->
<section class="game-area" id="gameArea">
  <div class="score-box">⭐ 得分: <span id="scoreNum">0</span></div>
  <div class="question-box">
    <div class="question-label">👉 找一找这个颜色!</div>
    <div class="question-text" id="questionText">Red</div>
    <div class="question-en" id="questionCn">红色</div>
    <button class="listen-btn" onclick="speakCurrentQuestion()">🔊 再听一次</button>
  </div>
  <div class="game-options" id="gameOptions"></div>
</section>

<!-- 大字弹窗 -->
<div class="pop-overlay" id="popOverlay" onclick="closePop()">
  <div class="pop-card" onclick="event.stopPropagation()">
    <button class="pop-close-btn" onclick="closePop()" aria-label="关闭">✕</button>
    <div class="pop-blob" id="popBlob"></div>
    <div class="pop-en" id="popEn">Red</div>
    <div class="pop-cn" id="popCn">红色</div>
    <div><button class="pop-speak-btn" onclick="speakPop()">🔊 再听一次</button></div>
    <div class="pop-hint">点击空白处关闭 · Tap to close</div>
  </div>
</div>

<!-- 反馈文字 -->
<div class="feedback" id="feedback"></div>

<div class="footer-tip">💡 提示:点击颜色可以听到英文发音哦!</div>

<script>
  // 颜色数据
  const colors = [
    { en: "Red",    cn: "红色",  hex: "#ff4757" },
    { en: "Orange", cn: "橙色",  hex: "#ff9f43" },
    { en: "Yellow", cn: "黄色",  hex: "#feca57" },
    { en: "Green",  cn: "绿色",  hex: "#26de81" },
    { en: "Blue",   cn: "蓝色",  hex: "#45aaf2" },
    { en: "Purple", cn: "紫色",  hex: "#a55eea" },
    { en: "Pink",   cn: "粉色",  hex: "#fd79a8" },
    { en: "Brown",  cn: "棕色",  hex: "#8b6f47" },
    { en: "Black",  cn: "黑色",  hex: "#2d3436" },
    { en: "White",  cn: "白色",  hex: "#f5f6fa" },
    { en: "Gray",   cn: "灰色",  hex: "#a4b0be" },
    { en: "Gold",   cn: "金色",  hex: "#ffd700" }
  ];

  let score = 0;
  let currentShowItem = null;
  let currentAnswer = null;

  // 初始化学习区
  function initLearnArea() {
    const area = document.getElementById('learnArea');
    area.innerHTML = colors.map((c, i) => `
      <div class="color-card" onclick="showColor(${i})">
        <div class="color-blob" style="background:${c.hex}"></div>
        <div class="en-name">${c.en}<span class="speaker-icon">🔊</span></div>
        <div class="cn-name">${c.cn}</div>
      </div>
    `).join('');
  }

  // 点击颜色卡片
  function showColor(i) {
    const c = colors[i];
    currentShowItem = c;
    document.getElementById('popBlob').style.background = c.hex;
    document.getElementById('popEn').textContent = c.en;
    document.getElementById('popCn').textContent = c.cn;
    document.getElementById('popOverlay').classList.add('show');
    speak(c.en);
  }

  function closePop() {
    document.getElementById('popOverlay').classList.remove('show');
  }

  function speakPop() {
    if (currentShowItem) speak(currentShowItem.en);
  }

  // ===== 声音设置 =====
  // 当前选择(默认:女声 + 美式)
  let voiceGender = localStorage.getItem('vc_gender') || 'female';
  let voiceAccent = localStorage.getItem('vc_accent') || 'us';
  let cachedVoices = [];

  // 已知男声名字(用于识别语音库中的性别,跨 macOS/Windows/Linux)
  const MALE_NAMES = [
    'alex','fred','tom','ralph','aaron','luca','markus','gordon','james',
    'daniel','oliver','arthur','george','ryan','guy','reed','rocko','aaron',
    'david','mark','eric','benjamin','jacob','liam','noah'
  ];
  // 已知女声名字
  const FEMALE_NAMES = [
    'samantha','victoria','karen','moira','tessa','zoe','fiona','veena',
    'kate','serena','hannah','amy','emma','joanna','kendra','kimberly','salli',
    'hazel','sonia','libby','aria','jenny','michelle','linda','heather',
    'susan','lisa','zira','nancy','amber'
  ];

  // 加载系统语音库
  function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    cachedVoices = window.speechSynthesis.getVoices();
  }

  // 根据口音+性别挑选语音
  function pickVoice(accent, gender) {
    const voices = cachedVoices.length ? cachedVoices : window.speechSynthesis.getVoices();
    const langPrefix = accent === 'uk' ? 'en-GB' : 'en-US';
    // 优先精确匹配,其次前缀匹配(兼容 en-GB_unix 等)
    let langVoices = voices.filter(v => v.lang === langPrefix);
    if (langVoices.length === 0) langVoices = voices.filter(v => v.lang.toLowerCase().startsWith(langPrefix.toLowerCase()));
    if (langVoices.length === 0) langVoices = voices.filter(v => v.lang.toLowerCase().startsWith('en'));
    if (langVoices.length === 0) return null;

    const preferred = gender === 'male' ? MALE_NAMES : FEMALE_NAMES;
    // 1) 按名字精确匹配
    for (const name of preferred) {
      const match = langVoices.find(v => v.name.toLowerCase().includes(name));
      if (match) return match;
    }
    // 2) 名字中带性别提示词(有些语音名含 male/female/man/woman)
    const genderHint = gender === 'male' ? /(male|man|\bm\b)/ : /(female|woman|\bf\b)/;
    const hinted = langVoices.find(v => genderHint.test(v.name.toLowerCase()));
    if (hinted) return hinted;

    // 3) 兜底:若该语言只有1个语音,直接用;若有多个,尝试错开取
    //    (很多系统一个语言只有2个语音,通常一男一女,用索引区分)
    if (langVoices.length === 1) return langVoices[0];
    // 按 name 排序后固定取一个,保证切换有区别
    const sorted = [...langVoices].sort((a,b) => a.name.localeCompare(b.name));
    return gender === 'male' ? sorted[0] : sorted[sorted.length - 1];
  }

  // 英文发音
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const voice = pickVoice(voiceAccent, voiceGender);
    if (voice) {
      u.voice = voice;
      u.lang = voice.lang;
    } else {
      u.lang = voiceAccent === 'uk' ? 'en-GB' : 'en-US';
    }
    u.rate = 0.8;
    // 男声稍降音调,女声略升,贴近自然
    u.pitch = voiceGender === 'male' ? 0.9 : 1.15;
    window.speechSynthesis.speak(u);
  }

  // 切换性别
  function setGender(g) {
    voiceGender = g;
    localStorage.setItem('vc_gender', g);
    document.getElementById('voiceMaleBtn').classList.toggle('active', g === 'male');
    document.getElementById('voiceFemaleBtn').classList.toggle('active', g === 'female');
  }

  // 切换口音
  function setAccent(a) {
    voiceAccent = a;
    localStorage.setItem('vc_accent', a);
    document.getElementById('accentUSBtn').classList.toggle('active', a === 'us');
    document.getElementById('accentUKBtn').classList.toggle('active', a === 'uk');
  }

  // 试听当前设置
  function testVoice() {
    const sample = voiceAccent === 'uk' ? 'Hello! Red, blue, and green.' : 'Hello! Red, blue, and green.';
    speak(sample);
  }

  // 语音库加载完成回调(部分浏览器异步加载)
  if ('speechSynthesis' in window) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  // 切换模式
  function switchMode(mode) {
    const learnBtn = document.getElementById('learnModeBtn');
    const gameBtn = document.getElementById('gameModeBtn');
    const learnArea = document.getElementById('learnArea');
    const gameArea = document.getElementById('gameArea');
    if (mode === 'learn') {
      learnBtn.classList.add('active');
      gameBtn.classList.remove('active');
      learnArea.style.display = 'grid';
      gameArea.classList.remove('show');
    } else {
      gameBtn.classList.add('active');
      learnBtn.classList.remove('active');
      learnArea.style.display = 'none';
      gameArea.classList.add('show');
      newQuestion();
    }
  }

  // 生成新题目
  function newQuestion() {
    // 随机选4个选项
    const shuffled = [...colors].sort(() => Math.random() - 0.5);
    const options = shuffled.slice(0, 4);
    currentAnswer = options[Math.floor(Math.random() * options.length)];

    document.getElementById('questionText').textContent = currentAnswer.en;
    document.getElementById('questionCn').textContent = currentAnswer.cn;

    const optArea = document.getElementById('gameOptions');
    optArea.innerHTML = options.map((c, i) => `
      <div class="option-card" style="background:${c.hex}" onclick="checkAnswer('${c.en}', this)"></div>
    `).join('');

    // 朗读题目
    setTimeout(() => speak(currentAnswer.en), 300);
  }

  function speakCurrentQuestion() {
    if (currentAnswer) speak(currentAnswer.en);
  }

  // 检查答案
  function checkAnswer(answer, el) {
    if (answer === currentAnswer.en) {
      el.classList.add('correct');
      score++;
      document.getElementById('scoreNum').textContent = score;
      showFeedback("✅ 真棒!", "#4caf50");
      launchConfetti();
      speak(currentAnswer.en);
      setTimeout(() => { newQuestion(); }, 1500);
    } else {
      el.classList.add('wrong');
      showFeedback("😢 再试试!", "#f44336");
      setTimeout(() => el.classList.remove('wrong'), 600);
    }
  }

  // 反馈文字
  function showFeedback(text, color) {
    const fb = document.getElementById('feedback');
    fb.textContent = text;
    fb.style.color = color;
    fb.classList.remove('show');
    void fb.offsetWidth; // 触发重绘
    fb.classList.add('show');
  }

  // 五彩纸屑
  function launchConfetti() {
    const colorsList = ['#ff4757','#ff9f43','#feca57','#26de81','#45aaf2','#a55eea','#fd79a8'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.background = colorsList[Math.floor(Math.random() * colorsList.length)];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-20px';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      c.style.transform = `rotate(${Math.random()*360}deg)`;
      document.body.appendChild(c);

      const duration = 1500 + Math.random() * 1500;
      const drift = (Math.random() - 0.5) * 200;
      c.animate([
        { transform: c.style.transform, top: '-20px', opacity: 1 },
        { transform: `translateX(${drift}px) rotate(${720 + Math.random()*360}deg)`, top: '100vh', opacity: 0.8 }
      ], { duration, easing: 'cubic-bezier(0.3, 0.7, 0.4, 1)' });

      setTimeout(() => c.remove(), duration);
    }
  }

  // 启动
  initLearnArea();
  // 应用已保存的声音设置到界面
  setGender(voiceGender);
  setAccent(voiceAccent);
</script>

</body>
</html>
