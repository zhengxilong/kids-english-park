<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥤 学习颜色 · 彩色杯子 Learn Colors with Cups</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(circle at 10% 0%, #e3f2fd 0%, transparent 50%),
      radial-gradient(circle at 90% 10%, #f3e5f5 0%, transparent 50%),
      radial-gradient(circle at 50% 100%, #fff9c4 0%, transparent 50%),
      #f1f8e9;
    min-height: 100vh;
    overflow-x: hidden;
    user-select: none;
  }

  header {
    text-align: center;
    padding: 24px 16px 12px;
  }

  h1 {
    font-size: clamp(28px, 6vw, 44px);
    color: #283593;
    text-shadow: 3px 3px 0 #fff, 6px 6px 0 rgba(0,0,0,0.08);
    letter-spacing: 2px;
    animation: bounce-title 2s ease-in-out infinite;
  }

  @keyframes bounce-title {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-6px) rotate(1deg); }
  }

  .subtitle {
    font-size: clamp(14px, 3.5vw, 20px);
    color: #3949ab;
    margin-top: 6px;
    font-weight: 600;
  }

  .mode-switch {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin: 16px 0 8px;
  }

  .mode-btn {
    padding: 12px 28px;
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 800;
    border: 4px solid #fff;
    border-radius: 50px;
    background: #fff;
    color: #283593;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.1), 0 8px 16px rgba(0,0,0,0.08);
    transition: all 0.15s;
  }

  .mode-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.1), 0 4px 8px rgba(0,0,0,0.08);
  }

  .mode-btn.active {
    background: linear-gradient(135deg, #283593, #7b1fa2);
    color: #fff;
  }

  .voice-settings {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px 18px;
    flex-wrap: wrap;
    padding: 8px 16px 16px;
    max-width: 900px;
    margin: 0 auto;
  }

  .voice-group {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.8);
    padding: 6px 8px;
    border-radius: 50px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.06);
  }

  .voice-group-label {
    font-size: 13px;
    font-weight: 800;
    color: #283593;
    padding-left: 6px;
  }

  .voice-toggle {
    padding: 7px 16px;
    font-size: 14px;
    font-weight: 700;
    border: none;
    border-radius: 50px;
    background: transparent;
    color: #999;
    cursor: pointer;
    transition: all 0.15s;
  }

  .voice-toggle.active {
    background: #fff;
    color: #283593;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  .voice-toggle:active {
    transform: scale(0.94);
  }

  /* 杯子网格 */
  .cups-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 22px;
    padding: 20px;
    max-width: 1000px;
    margin: 0 auto;
  }

  .cup-card {
    background: #fff;
    border-radius: 28px;
    padding: 18px 12px 16px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 8px 0 rgba(0,0,0,0.08), 0 12px 24px rgba(0,0,0,0.06);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
    border: 4px solid #fff;
  }

  .cup-card:hover {
    transform: translateY(-6px) rotate(-2deg);
  }

  .cup-card:active {
    transform: translateY(2px) scale(0.97);
    box-shadow: 0 3px 0 rgba(0,0,0,0.08), 0 6px 12px rgba(0,0,0,0.06);
  }

  .cup-svg {
    width: 110px;
    height: 120px;
    margin: 0 auto 10px;
    display: block;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.2));
    animation: cup-bob 2.8s ease-in-out infinite;
  }

  @keyframes cup-bob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-6px) rotate(3deg); }
  }

  .cup-svg svg { width: 100%; height: 100%; }

  .en-name {
    font-size: clamp(20px, 4.5vw, 26px);
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1.2;
  }

  .cn-name {
    font-size: clamp(15px, 3.5vw, 18px);
    color: #777;
    margin-top: 4px;
    font-weight: 700;
  }

  .speaker-icon {
    display: inline-block;
    font-size: 17px;
    margin-left: 4px;
    vertical-align: middle;
  }

  /* 弹窗 */
  .pop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }

  .pop-overlay.show {
    display: flex;
    animation: fade-in 0.2s;
  }

  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .pop-card {
    background: #fff;
    border-radius: 42px;
    padding: 42px 52px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-width: 90vw;
    position: relative;
  }

  .pop-speak-btn {
    margin-top: 20px;
    padding: 14px 36px;
    font-size: clamp(20px, 5vw, 28px);
    font-weight: 900;
    border: 4px solid #fff;
    border-radius: 50px;
    background: linear-gradient(135deg, #ec407a, #d81b60);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 0 #880e4f, 0 10px 20px rgba(0,0,0,0.15);
    transition: all 0.12s;
    letter-spacing: 1px;
  }
  .pop-speak-btn:hover { transform: translateY(-2px); }
  .pop-speak-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #880e4f, 0 4px 8px rgba(0,0,0,0.15);
  }
  .pop-close-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 3px solid #fff;
    background: linear-gradient(135deg, #ef5350, #c62828);
    color: #fff;
    font-size: 24px;
    font-weight: 900;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 0 #8b0000, 0 6px 12px rgba(0,0,0,0.18);
    transition: all 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .pop-close-btn:hover { transform: translateY(-2px) rotate(90deg); }
  .pop-close-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #8b0000, 0 3px 6px rgba(0,0,0,0.18);
  }

  @keyframes pop-in {
    from { transform: scale(0.3); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .pop-cup {
    width: 170px;
    height: 180px;
    margin: 0 auto 18px;
    filter: drop-shadow(0 10px 16px rgba(0,0,0,0.25));
    animation: cup-bob 2s ease-in-out infinite;
  }

  .pop-cup svg { width: 100%; height: 100%; }

  .pop-en {
    font-size: clamp(40px, 11vw, 64px);
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1.1;
  }

  .pop-cn {
    font-size: clamp(24px, 6vw, 36px);
    color: #777;
    margin-top: 8px;
    font-weight: 800;
  }

  .pop-hint {
    font-size: 14px;
    color: #bbb;
    margin-top: 20px;
  }

  /* 游戏模式 */
  .game-area {
    display: none;
    padding: 30px 20px;
    max-width: 800px;
    margin: 0 auto;
    text-align: center;
  }

  .game-area.show { display: block; }

  .question-box {
    background: #fff;
    border-radius: 30px;
    padding: 28px 24px;
    margin-bottom: 28px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.08), 0 12px 24px rgba(0,0,0,0.06);
  }

  .question-label {
    font-size: clamp(16px, 4vw, 20px);
    color: #7b1fa2;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .question-text {
    font-size: clamp(30px, 8vw, 52px);
    font-weight: 900;
  }

  .question-cn {
    font-size: clamp(20px, 5vw, 28px);
    color: #666;
    margin-top: 8px;
    font-weight: 700;
  }

  .listen-btn {
    margin-top: 14px;
    padding: 10px 22px;
    font-size: 16px;
    font-weight: 700;
    border: 3px solid #283593;
    border-radius: 50px;
    background: #fff;
    color: #283593;
    cursor: pointer;
    transition: all 0.15s;
  }

  .listen-btn:active { transform: scale(0.95); }

  .game-options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 18px;
  }

  .option-card {
    border-radius: 26px;
    cursor: pointer;
    background: #fff;
    padding: 14px 10px 12px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.08), 0 10px 20px rgba(0,0,0,0.08);
    transition: transform 0.15s, box-shadow 0.15s;
    border: 5px solid #fff;
    text-align: center;
  }

  .option-card .opt-cup {
    width: 82px;
    height: 90px;
    margin: 0 auto 6px;
  }
  .option-card .opt-cup svg { width: 100%; height: 100%; }

  .option-card .opt-text {
    font-size: 16px;
    font-weight: 800;
    color: #333;
  }

  .option-card:hover { transform: translateY(-3px); }
  .option-card:active {
    transform: translateY(2px);
    box-shadow: 0 3px 0 rgba(0,0,0,0.08), 0 5px 10px rgba(0,0,0,0.08);
  }

  .option-card.correct { animation: correct-pulse 0.6s; border-color: #43a047; }
  .option-card.wrong { animation: wrong-shake 0.5s; border-color: #e53935; }

  @keyframes correct-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  @keyframes wrong-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-12px); }
    75% { transform: translateX(12px); }
  }

  .score-box {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    padding: 10px 22px;
    border-radius: 50px;
    font-size: clamp(18px, 4.5vw, 24px);
    font-weight: 800;
    color: #283593;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08);
    margin-bottom: 20px;
  }

  .feedback {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: clamp(40px, 12vw, 80px);
    font-weight: 900;
    z-index: 200;
    pointer-events: none;
    text-shadow: 4px 4px 0 #fff;
  }

  .feedback.show { animation: feedback-pop 1.2s ease-out forwards; }

  @keyframes feedback-pop {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-20deg); opacity: 0; }
    30% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); opacity: 1; }
    70% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.4) rotate(0deg); opacity: 0; }
  }

  .confetti {
    position: fixed;
    width: 12px;
    height: 12px;
    pointer-events: none;
    z-index: 150;
  }

  .footer-tip {
    text-align: center;
    padding: 20px;
    color: #999;
    font-size: 14px;
    font-weight: 600;
  }

  @media (max-width: 480px) {
    .cups-grid { gap: 14px; padding: 14px; grid-template-columns: repeat(2, 1fr); }
    .cup-svg { width: 90px; height: 100px; }
    .pop-card { padding: 30px 28px; }
    .pop-cup { width: 130px; height: 140px; }
    .option-card .opt-cup { width: 66px; height: 74px; }
  }
</style>
</head>
<body>

<header>
  <h1>🥤 彩色杯子学颜色</h1>
  <div class="subtitle">Learn Colors with Cups · 点一点漂亮的杯子!</div>
</header>

<div class="mode-switch">
  <button class="mode-btn active" id="learnModeBtn" onclick="switchMode('learn')">📖 学习</button>
  <button class="mode-btn" id="gameModeBtn" onclick="switchMode('game')">🎮 游戏</button>
</div>

<div class="voice-settings">
  <div class="voice-group">
    <span class="voice-group-label">🗣️ 声音</span>
    <button class="voice-toggle" id="voiceMaleBtn" onclick="setGender('male')">👨 男声</button>
    <button class="voice-toggle active" id="voiceFemaleBtn" onclick="setGender('female')">👩 女声</button>
  </div>
  <div class="voice-group">
    <span class="voice-group-label">🌍 口音</span>
    <button class="voice-toggle active" id="accentUSBtn" onclick="setAccent('us')">🇺🇸 美式</button>
    <button class="voice-toggle" id="accentUKBtn" onclick="setAccent('uk')">🇬🇧 英式</button>
  </div>
  <button class="voice-toggle" id="testVoiceBtn" style="background:#fff;color:#283593;box-shadow:0 2px 6px rgba(0,0,0,0.1);" onclick="testVoice()">🔊 试听</button>
</div>

<!-- 学习区 -->
<section class="cups-grid" id="learnArea"></section>

<!-- 游戏区 -->
<section class="game-area" id="gameArea">
  <div class="score-box">⭐ 得分: <span id="scoreNum">0</span></div>
  <div class="question-box">
    <div class="question-label">👉 听一听,找一找哪个是这个颜色!</div>
    <div class="question-text" id="questionText">Red</div>
    <div class="question-cn" id="questionCn">红色</div>
    <button class="listen-btn" onclick="speakCurrentQuestion()">🔊 再听一次</button>
  </div>
  <div class="game-options" id="gameOptions"></div>
</section>

<!-- 弹窗 -->
<div class="pop-overlay" id="popOverlay" onclick="closePop()">
  <div class="pop-card" onclick="event.stopPropagation()">
    <button class="pop-close-btn" onclick="closePop()" aria-label="关闭">✕</button>
    <div class="pop-cup" id="popCup"></div>
    <div class="pop-en" id="popEn">Red</div>
    <div class="pop-cn" id="popCn">红色</div>
    <div><button class="pop-speak-btn" onclick="speakPop()">🔊 再听一次</button></div>
    <div class="pop-hint">点击空白处关闭 · Tap to close</div>
  </div>
</div>

<div class="feedback" id="feedback"></div>

<div class="footer-tip">💡 提示:杯子里还有可爱的饮料、泡泡和吸管,一起点一点看一看!🧊🫧</div>

<script>
  // 通用生成彩色杯子 SVG 的函数(100x100 viewBox)
  // drinkType: juice / milk / bubbleTea / cola / lemonade / coffee / hotChoco / matcha / smoothie / milkshake / soda / water
  function makeCupSVG(mainColor, accentColor, drinkType) {
    // 杯身:上宽下窄的杯体 + 右侧把手 + 吸管 + 冰块/泡泡 + 液面装饰
    let liquid = '';
    switch (drinkType) {
      case 'juice':
        liquid = `
          <ellipse cx="50" cy="30" rx="28" ry="5" fill="${accentColor}"/>
          <circle cx="42" cy="58" r="1.6" fill="rgba(255,255,255,0.6)"/>
          <circle cx="56" cy="70" r="1.4" fill="rgba(255,255,255,0.6)"/>
          <circle cx="50" cy="64" r="1.2" fill="rgba(255,255,255,0.6)"/>
        `; break;
      case 'milk':
        liquid = `
          <ellipse cx="50" cy="30" rx="28" ry="5" fill="${accentColor}"/>
          <circle cx="46" cy="62" r="1.4" fill="rgba(0,0,0,0.06)"/>
        `; break;
      case 'bubbleTea':
        liquid = `
          <ellipse cx="50" cy="30" rx="28" ry="5" fill="${accentColor}"/>
          <g fill="#3e2723">
            <circle cx="40" cy="80" r="2.2"/><circle cx="46" cy="81" r="2.2"/><circle cx="52" cy="80" r="2.2"/><circle cx="58" cy="82" r="2.2"/><circle cx="43" cy="78" r="2"/><circle cx="55" cy="78" r="2"/>
          </g>
        `; break;
      case 'cola':
        liquid = `
          <ellipse cx="50" cy="30" rx="28" ry="5" fill="${accentColor}"/>
          <circle cx="40" cy="54" r="1.8" fill="rgba(255,255,255,0.7)"/>
          <circle cx="56" cy="60" r="1.5" fill="rgba(255,255,255,0.7)"/>
          <circle cx="48" cy="68" r="1.4" fill="rgba(255,255,255,0.7)"/>
          <circle cx="44" cy="74" r="1.2" fill="rgba(255,255,255,0.6)"/>
        `; break;
      case 'lemonade':
        liquid = `
          <ellipse cx="50" cy="30" rx="28" ry="5" fill="${accentColor}"/>
          <circle cx="58" cy="45" r="5" fill="#fff9c4" stroke="#fbc02d" stroke-width="0.6"/>
          <path d="M58 42 L58 48 M55 45 L61 45" stroke="#fbc02d" stroke-width="0.4"/>
        `; break;
      case 'coffee':
        liquid = `
          <ellipse cx="50" cy="30" rx="28" ry="5" fill="${accentColor}"/>
          <!-- 蒸汽 -->
          <path d="M38 22 Q 40 18 38 14" stroke="rgba(158,158,158,0.7)" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M50 22 Q 48 16 50 10" stroke="rgba(158,158,158,0.7)" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M62 22 Q 64 18 62 14" stroke="rgba(158,158,158,0.7)" stroke-width="2" fill="none" stroke-linecap="round"/>
        `; break;
      case 'hotChoco':
        liquid = `
          <ellipse cx="50" cy="30" rx="28" ry="5" fill="${accentColor}"/>
          <path d="M40 22 Q 42 18 40 14" stroke="rgba(158,158,158,0.7)" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M56 22 Q 58 18 56 14" stroke="rgba(158,158,158,0.7)" stroke-width="2" fill="none" stroke-linecap="round"/>
          <circle cx="50" cy="40" r="6" fill="#fff" opacity="0.85"/>
          <circle cx="47" cy="40" r="2.2" fill="#8d6e63"/>
          <circle cx="52" cy="38" r="1.6" fill="#8d6e63"/>
        `; break;
      case 'matcha':
        liquid = `
          <ellipse cx="50" cy="30" rx="28" ry="5" fill="${accentColor}"/>
          <path d="M42 25 Q 50 20 58 25 Q 50 30 42 25 Z" fill="rgba(255,255,255,0.3)"/>
        `; break;
      case 'smoothie':
        liquid = `
          <ellipse cx="50" cy="30" rx="28" ry="5" fill="${accentColor}"/>
          <path d="M35 50 Q 50 42 65 50 Q 50 58 35 50 Z" fill="rgba(255,255,255,0.25)"/>
          <circle cx="42" cy="55" r="2.2" fill="#e91e63" opacity="0.8"/>
          <circle cx="58" cy="60" r="1.8" fill="#c2185b" opacity="0.8"/>
        `; break;
      case 'milkshake':
        liquid = `
          <ellipse cx="50" cy="30" rx="28" ry="5" fill="${accentColor}"/>
          <!-- 奶油顶 -->
          <path d="M32 24 Q 38 12 50 16 Q 62 10 68 24 Q 60 18 50 22 Q 40 18 32 24 Z" fill="#fff" stroke="rgba(0,0,0,0.05)" stroke-width="0.5"/>
          <circle cx="50" cy="12" r="2.8" fill="#e53935"/>
        `; break;
      case 'soda':
        liquid = `
          <ellipse cx="50" cy="30" rx="28" ry="5" fill="${accentColor}"/>
          <g fill="rgba(255,255,255,0.7)">
            <circle cx="40" cy="48" r="1.6"/>
            <circle cx="50" cy="54" r="1.4"/>
            <circle cx="60" cy="60" r="1.8"/>
            <circle cx="44" cy="66" r="1.2"/>
            <circle cx="55" cy="72" r="1.5"/>
          </g>
        `; break;
      case 'water':
      default:
        liquid = `
          <ellipse cx="50" cy="30" rx="28" ry="5" fill="${accentColor}"/>
          <path d="M38 50 Q 50 40 62 50 Q 50 60 38 50 Z" fill="rgba(255,255,255,0.5)"/>
        `; break;
    }

    return `
<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
  <!-- 影子 -->
  <ellipse cx="50" cy="104" rx="30" ry="3" fill="rgba(0,0,0,0.12)"/>
  <!-- 把手(右侧C形) -->
  <path d="M74 48 Q 92 48 92 65 Q 92 82 74 82"
        fill="none" stroke="${mainColor}" stroke-width="7" stroke-linecap="round"/>
  <path d="M74 48 Q 86 48 86 65 Q 86 82 74 82"
        fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 杯子外层描边(杯子本身主色+深色描边) -->
  <path d="M22 26 L30 92 Q 32 100 50 100 Q 68 100 70 92 L78 26 Z"
        fill="${mainColor}" stroke="rgba(0,0,0,0.1)" stroke-width="1.2"/>
  <!-- 杯口白色高光(椭圆厚边) -->
  <ellipse cx="50" cy="26" rx="28" ry="6" fill="rgba(255,255,255,0.9)" stroke="${mainColor}" stroke-width="2"/>
  <!-- 液面(饮料颜色 稍低于杯口) -->
  <ellipse cx="50" cy="30" rx="26" ry="5" fill="${mainColor}" opacity="0.35"/>
  <!-- 饮料液面装饰(按类型) -->
  ${liquid}
  <!-- 吸管(从杯口上方伸出) -->
  <rect x="64" y="4" width="3.2" height="44" rx="1.6" fill="#e91e63" transform="rotate(8 66 26)"/>
  <rect x="64" y="4" width="3.2" height="10" rx="1.6" fill="#f8bbd0" transform="rotate(8 66 26)"/>
  <!-- 杯子高光(左侧长条) -->
  <path d="M30 36 Q 28 66 32 90" stroke="rgba(255,255,255,0.55)" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>`;
  }

  // 12 种颜色,每种配对应饮料
  const colors = [
    { en: "Red",       cn: "红色", main: "#ef5350", accent: "#b71c1c", drink: "juice"     }, // 红果汁
    { en: "Orange",    cn: "橙色", main: "#ffa726", accent: "#e65100", drink: "juice"     }, // 橙汁
    { en: "Yellow",    cn: "黄色", main: "#ffee58", accent: "#f9a825", drink: "lemonade"  }, // 柠檬水
    { en: "Green",     cn: "绿色", main: "#66bb6a", accent: "#2e7d32", drink: "matcha"    }, // 抹茶
    { en: "Blue",      cn: "蓝色", main: "#42a5f5", accent: "#1565c0", drink: "soda"      }, // 蓝色汽水
    { en: "Purple",    cn: "紫色", main: "#ab47bc", accent: "#6a1b9a", drink: "smoothie"  }, // 紫葡萄思慕雪
    { en: "Pink",      cn: "粉色", main: "#f48fb1", accent: "#c2185b", drink: "milkshake" }, // 草莓奶昔
    { en: "Brown",     cn: "棕色", main: "#8d6e63", accent: "#4e342e", drink: "coffee"    }, // 热咖啡
    { en: "Black",     cn: "黑色", main: "#424242", accent: "#1b1b1b", drink: "cola"      }, // 可乐
    { en: "White",     cn: "白色", main: "#f5f5f5", accent: "#e3f2fd", drink: "milk"      }, // 牛奶
    { en: "Gray",      cn: "灰色", main: "#9e9e9e", accent: "#424242", drink: "hotChoco"  }, // 热可可
    { en: "Gold",      cn: "金色", main: "#ffd54f", accent: "#8d6e63", drink: "bubbleTea" }  // 金色奶茶
  ];

  let score = 0;
  let currentShowItem = null;
  let currentAnswer = null;

  function textColor(main) {
    return main === '#f5f5f5' ? '#9e9e9e' : main === '#ffee58' ? '#f9a825' : main;
  }

  function initLearnArea() {
    const area = document.getElementById('learnArea');
    area.innerHTML = colors.map((c, i) => {
      const svg = makeCupSVG(c.main, c.accent, c.drink);
      return `
      <div class="cup-card" onclick="showCup(${i})">
        <div class="cup-svg">${svg}</div>
        <div class="en-name" style="color:${textColor(c.main)};">${c.en}<span class="speaker-icon">🔊</span></div>
        <div class="cn-name">${c.cn}</div>
      </div>`;
    }).join('');
  }

  function showCup(i) {
    const c = colors[i];
    currentShowItem = c;
    document.getElementById('popCup').innerHTML = makeCupSVG(c.main, c.accent, c.drink);
    const popEn = document.getElementById('popEn');
    popEn.textContent = c.en;
    popEn.style.color = textColor(c.main);
    document.getElementById('popCn').textContent = c.cn;
    document.getElementById('popOverlay').classList.add('show');
    speak(c.en);
  }

  function closePop() {
    document.getElementById('popOverlay').classList.remove('show');
  }

  function speakPop(){ if(currentShowItem) speak(currentShowItem.en); }

  // ===== 声音设置 =====
  let voiceGender = localStorage.getItem('vcc_gender') || 'female';
  let voiceAccent = localStorage.getItem('vcc_accent') || 'us';
  let cachedVoices = [];

  const MALE_NAMES = ['alex','fred','tom','ralph','aaron','luca','markus','gordon','james','daniel','oliver','arthur','george','ryan','guy','reed','rocko','david','mark','eric','benjamin','jacob','liam','noah'];
  const FEMALE_NAMES = ['samantha','victoria','karen','moira','tessa','zoe','fiona','veena','kate','serena','hannah','amy','emma','joanna','kendra','kimberly','salli','hazel','sonia','libby','aria','jenny','michelle','linda','heather','susan','lisa','zira','nancy','amber'];

  function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    cachedVoices = window.speechSynthesis.getVoices();
  }

  function pickVoice(accent, gender) {
    const voices = cachedVoices.length ? cachedVoices : window.speechSynthesis.getVoices();
    const langPrefix = accent === 'uk' ? 'en-GB' : 'en-US';
    let langVoices = voices.filter(v => v.lang === langPrefix);
    if (langVoices.length === 0) langVoices = voices.filter(v => v.lang.toLowerCase().startsWith(langPrefix.toLowerCase()));
    if (langVoices.length === 0) langVoices = voices.filter(v => v.lang.toLowerCase().startsWith('en'));
    if (langVoices.length === 0) return null;

    const preferred = gender === 'male' ? MALE_NAMES : FEMALE_NAMES;
    for (const name of preferred) {
      const match = langVoices.find(v => v.name.toLowerCase().includes(name));
      if (match) return match;
    }
    const genderHint = gender === 'male' ? /(male|man|\bm\b)/ : /(female|woman|\bf\b)/;
    const hinted = langVoices.find(v => genderHint.test(v.name.toLowerCase()));
    if (hinted) return hinted;

    if (langVoices.length === 1) return langVoices[0];
    const sorted = [...langVoices].sort((a,b) => a.name.localeCompare(b.name));
    return gender === 'male' ? sorted[0] : sorted[sorted.length - 1];
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const voice = pickVoice(voiceAccent, voiceGender);
    if (voice) { u.voice = voice; u.lang = voice.lang; }
    else { u.lang = voiceAccent === 'uk' ? 'en-GB' : 'en-US'; }
    u.rate = 0.8;
    u.pitch = voiceGender === 'male' ? 0.9 : 1.15;
    window.speechSynthesis.speak(u);
  }

  function setGender(g) {
    voiceGender = g;
    localStorage.setItem('vcc_gender', g);
    document.getElementById('voiceMaleBtn').classList.toggle('active', g === 'male');
    document.getElementById('voiceFemaleBtn').classList.toggle('active', g === 'female');
  }

  function setAccent(a) {
    voiceAccent = a;
    localStorage.setItem('vcc_accent', a);
    document.getElementById('accentUSBtn').classList.toggle('active', a === 'us');
    document.getElementById('accentUKBtn').classList.toggle('active', a === 'uk');
  }

  function testVoice() {
    speak("Hello! Let's learn colors with cups!");
  }

  if ('speechSynthesis' in window) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function switchMode(mode) {
    const learnBtn = document.getElementById('learnModeBtn');
    const gameBtn = document.getElementById('gameModeBtn');
    const learnArea = document.getElementById('learnArea');
    const gameArea = document.getElementById('gameArea');
    if (mode === 'learn') {
      learnBtn.classList.add('active');
      gameBtn.classList.remove('active');
      learnArea.style.display = 'grid';
      gameArea.classList.remove('show');
    } else {
      gameBtn.classList.add('active');
      learnBtn.classList.remove('active');
      learnArea.style.display = 'none';
      gameArea.classList.add('show');
      newQuestion();
    }
  }

  function newQuestion() {
    const shuffled = [...colors].sort(() => Math.random() - 0.5);
    const options = shuffled.slice(0, 4);
    currentAnswer = options[Math.floor(Math.random() * options.length)];

    document.getElementById('questionText').textContent = currentAnswer.en;
    document.getElementById('questionText').style.color = textColor(currentAnswer.main);
    document.getElementById('questionCn').textContent = currentAnswer.cn;

    const optArea = document.getElementById('gameOptions');
    optArea.innerHTML = options.map(c => {
      const svg = makeCupSVG(c.main, c.accent, c.drink);
      return `
      <div class="option-card" onclick="checkAnswer('${c.en}', this)">
        <div class="opt-cup">${svg}</div>
        <div class="opt-text" style="color:${textColor(c.main)};">${c.en}</div>
      </div>`;
    }).join('');

    setTimeout(() => speak(currentAnswer.en), 300);
  }

  function speakCurrentQuestion() {
    if (currentAnswer) speak(currentAnswer.en);
  }

  function checkAnswer(answer, el) {
    if (answer === currentAnswer.en) {
      el.classList.add('correct');
      score++;
      document.getElementById('scoreNum').textContent = score;
      showFeedback("✅ 真棒!", "#43a047");
      launchConfetti();
      speak(currentAnswer.en);
      setTimeout(() => { newQuestion(); }, 1500);
    } else {
      el.classList.add('wrong');
      showFeedback("😢 再试试!", "#e53935");
      setTimeout(() => el.classList.remove('wrong'), 600);
    }
  }

  function showFeedback(text, color) {
    const fb = document.getElementById('feedback');
    fb.textContent = text;
    fb.style.color = color;
    fb.classList.remove('show');
    void fb.offsetWidth;
    fb.classList.add('show');
  }

  function launchConfetti() {
    const colorsList = ['#283593','#3949ab','#7b1fa2','#8e24aa','#ab47bc','#26a69a','#42a5f5','#ffa726','#ef5350'];
    for (let i = 0; i < 45; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.background = colorsList[Math.floor(Math.random() * colorsList.length)];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-20px';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      c.style.transform = `rotate(${Math.random()*360}deg)`;
      document.body.appendChild(c);

      const duration = 1500 + Math.random() * 1700;
      const drift = (Math.random() - 0.5) * 220;
      c.animate([
        { transform: c.style.transform, top: '-20px', opacity: 1 },
        { transform: `translateX(${drift}px) rotate(${720 + Math.random()*360}deg)`, top: '100vh', opacity: 0.8 }
      ], { duration, easing: 'cubic-bezier(0.3, 0.7, 0.4, 1)' });

      setTimeout(() => c.remove(), duration);
    }
  }

  initLearnArea();
  setGender(voiceGender);
  setAccent(voiceAccent);
</script>

</body>
</html>
